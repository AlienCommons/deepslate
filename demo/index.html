<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Deepslate fluid renderer</title>
	<style>
		:root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d1117; }
		#preview { display: block; width: 100%; height: 100%; cursor: crosshair; image-rendering: pixelated; }
		.hud { position: fixed; top: 16px; left: 16px; max-width: 440px; padding: 12px 14px; border: 1px solid #ffffff2b; border-radius: 6px; background: #0d1117d9; color: #e6edf3; line-height: 1.5; pointer-events: none; backdrop-filter: blur(8px); }
		.hud strong { color: #fff; }
		.hud small { display: block; color: #9da7b3; }
		.is-playing .hint { display: none; }
		.crosshair { display: none; position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); pointer-events: none; }
		.crosshair::before, .crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 1px #000; }
		.crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
		.crosshair::after { left: 0; top: 6px; width: 14px; height: 2px; }
		.is-playing .crosshair { display: block; }
	</style>
</head>
<body>
	<canvas id="preview"></canvas>
	<div class="hud">
		<strong>Deepslate · Minecraft Java 26.2</strong>
		<small id="status">WASD move · mouse look · Space/Shift rise/fall · Ctrl sprint · Esc release</small>
		<small class="hint">Click the preview to capture the mouse.</small>
	</div>
	<div class="crosshair" aria-hidden="true"></div>
	<script src="./main.ts" type="module"></script>
</body>
</html>
